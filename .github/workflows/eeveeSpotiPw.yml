name: Build IPA from your own eeveeSpotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        run: |
          mkdir -p ipa
          curl -fsSL "${{ inputs.ipa_url }}" -o ipa/spotify.ipa

          case "$(file --mime-type -b ipa/spotify.ipa)" in
            application/zip|application/x-ios-app)
              ;;
            *)
              echo "::error::Not an IPA"
              exit 1
              ;;
          esac

      - name: Download EeveeSpotify
        run: |
          curl -fsSL \
            "https://github.com/whoeevee/EeveeSpotifyReborn/releases/download/swift6.2.2/com.eevee.spotify_6.2.2_iphoneos-arm64.deb" \
            -o EeveeSpotify.deb

          dpkg-deb --info EeveeSpotify.deb

      - name: Download SwiftProtobuf
        run: |
          curl -fsSL \
            "https://github.com/whoeevee/EeveeSpotifyReborn/releases/download/swift6.2.2/org.swift.protobuf.swiftprotobuf_1.29.0_iphoneos-arm64.deb" \
            -o SwiftProtobuf.deb

          dpkg-deb --info SwiftProtobuf.deb

      - name: Build spoti.pw
        run: |
          make release

      - name: Inject EeveeSpotify
        run: |
          mkdir -p combined

          cyan \
            -i out/*.ipa \
            -f EeveeSpotify.deb \
            -f SwiftProtobuf.deb \
            -o combined/spoti.pw-EeveeSpotify.ipa

      - name: Check final IPA
        run: |
          ls -lh combined/
          file combined/spoti.pw-EeveeSpotify.ipa

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: spoti.pw-EeveeSpotify
          path: combined/spoti.pw-EeveeSpotify.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="spotifyglass-${{ github.run_id }}"

          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"

          curl -fsS \
            -X POST \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@combined/spoti.pw-EeveeSpotify.ipa" \
            "https://filebin.net/$BIN/spoti.pw-EeveeSpotify.ipa" >/dev/null

          echo "- https://filebin.net/$BIN/spoti.pw-EeveeSpotify.ipa" >> "$GITHUB_STEP_SUMMARY"
